---
services:
  app82:
    build:
      context: .
      args:
        PHP_VERSION: "8.2"
    environment:
      PHP_IDE_CONFIG: "serverName=icanboogie-datetime"
    volumes:
      - .:/app:delegated
      - ~/.composer:/root/.composer:delegated
    working_dir: /app
  app83:
    build:
      context: .
      args:
