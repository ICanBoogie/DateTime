---
services:
  app82:
    build:
      context: .
      args:
        PHP_VERSION: "8.2"
    environment:
      PHP_IDE_CONFIG: 'serverName=icanboogie-datetime'
    volumes:
      - .:/app:delegated
      - composer-cache:/root/.composer
    working_dir: /app

  app85:
    build:
      context: .
      args:
        PHP_VERSION: "8.5"
    environment:
      PHP_IDE_CONFIG: 'serverName=icanboogie-datetime'
    volumes:
      - .:/app:delegated
      - composer-cache:/root/.composer
    working_dir: /app

volumes:
  composer-cache: ~
